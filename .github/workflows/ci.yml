name: CI

on:
  push:
    branches:
      - main
  # Every pull request, not only those targeting main. A stacked PR — one
  # opened against another branch while its parent is still in review —
  # matched no branch filter here and so ran no checks at all, which reads
  # as "nothing to report" rather than "nothing was run".
  pull_request:
  # By hand, from the Actions tab or `gh workflow run ci.yml --ref <branch>`.
  # The benchmarks run only outside pull requests, so this is the way to run
  # them on a branch, a change to their own jobs included, before it merges.
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint-and-test:
    name: Lint and Test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          # '1.27' rather than go-version-file: go.mod, still deliberately —
          # though the reason is now insurance rather than a live problem.
          #
          # go.mod used to declare `go 1.25.8`, a patch-level minimum astrogo
          # never asked for: `go mod tidy` raises the directive to the maximum
          # any dependency declares, and gocloud-ext's seven modules declare
          # 1.25.8 (#109). Reading it here made setup-go demand that exact
          # patch, and every observed job logged "Attempting to download
          # 1.25.8" — the toolchain fetched and extracted before the job could
          # start. On PR #151 that step hung for 25 minutes without running a
          # single test.
          #
          # The directive is now `go 1.27`, so that hazard is gone at its
          # source and go-version-file would be safe today. The explicit pin
          # stays because the hazard can come back the same way it arrived —
          # one dependency declaring a patch-level version above ours and one
          # `go mod tidy` — and it would come back silently. A minor-version
          # spec cannot: Go refuses to build below the declared directive and
          # fetches what it needs, so a divergence degrades to a download
          # rather than to a wrong result, and internal/docsguard fails if
          # these pins and go.mod ever disagree on the minor version.
          go-version: '1.27'
          cache: true

      - name: Verify dependencies
        run: go mod verify

      - name: Check go mod tidy
        shell: bash
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Run tests with coverage
        if: matrix.os == 'ubuntu-latest'
        run: go test -v -coverprofile=coverage.out -covermode=atomic ./...

      - name: Run tests
        if: matrix.os != 'ubuntu-latest'
        run: go test -v ./...

      # The default `go test ./...` never compiles a file behind a build
      # tag, and neither does golangci-lint below, which runs untagged. So
      # 59 test files — 34 network, 17 validation, 8 integration — are only
      # ever built by the weekly Validation workflow — off the pull-request
      # path by design, because those suites query other people's services.
      #
      # The consequence is that a tagged file that does not compile reaches
      # main green. It has happened: #75 rewrote an import in
      # ephemeris/kepler/validation_test.go and left two references to the old
      # alias behind, so `go vet -tags=network` did not build that package on
      # main until #78 rebased onto it and noticed.
      #
      # vet type-checks those files without running any of them, so this costs
      # seconds and makes no external request. It is the compile check, not a
      # substitute for running the suites.
      - name: Vet build-tagged files
        if: matrix.os == 'ubuntu-latest'
        run: go vet -tags="integration,network,validation" ./...

      - name: Run golangci-lint
        if: matrix.os == 'ubuntu-latest'
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          # v2.13+: .golangci.yml disables exhaustruct_v5, which does not
          # exist before it - v2.12 rejects the whole config with exit 3.
          # v2.14+: Go 1.27.2 writes export data version 5, which needs
          # golang.org/x/tools v0.50.0; v2.13 carries v0.49.0 and fails every
          # package with "export data version 5 is greater than maximum
          # supported version 4" before linting anything (#681).
          # v2.15: errcheck sees the error half of a range over an
          # iter.Seq2[T, error], which `for range` silently discards.
          version: v2.15
          args: --timeout=5m

      # examples/ is its own module (#124), so nothing above compiles it:
      # `go build ./...`, `go vet ./...` and golangci-lint all stop at the
      # module boundary. Without these steps the 32 example programs would
      # build only when someone ran them by hand, and the README's claim that
      # every sample in it was actually compiled would decay silently.
      #
      # They reach the library through `replace ../`, so they build against
      # this commit's working tree — an API change that breaks an example
      # fails here, which is the whole reason they are still verified rather
      # than merely shipped.
      - name: Build the examples module
        shell: bash
        working-directory: examples
        run: |
          go build ./...
          go vet ./...

      - name: Check go mod tidy (examples)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        working-directory: examples
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      # Run from examples/ but pointed at the root config, deliberately: with
      # --config ../.golangci.yml the reported paths stay relative to the
      # repository root, so .golangci.yml's `path: "examples/"` exclusions
      # still match. A copied config in examples/ would drift; one run from
      # the wrong directory would silently stop excluding.
      - name: Run golangci-lint (examples)
        if: matrix.os == 'ubuntu-latest'
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.15
          working-directory: examples
          args: --timeout=5m --config ../.golangci.yml

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.out
          fail_ci_if_error: false

  # A break in the exported API must be declared, not discovered downstream.
  #
  # The Changelog Fragment job — in changelog.yml, which has its own trigger for
  # the reason recorded there — checks a fragment exists. It cannot check the
  # fragment is true. apidiff can: it compares this pull request's head against
  # its base and fails only when the exported API changes incompatibly and no
  # fragment says so. That is what turns "a human wrote it down" into something
  # CI knows.
  #
  # This one stays here. It is satisfied by committing a fragment rather than by
  # applying a label, so an ordinary `synchronize` already re-runs it.
  #
  # See .github/scripts/api-diff.sh for why the comparison is against the base
  # rather than the last release tag, and why the rule is one-directional.
  api-diff:
    name: API Diff
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The script reads the base commit out of this clone, so the history
          # has to be here. A shallow clone leaves it with nothing to compare
          # against.
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27'
          cache: true

      # Pinned, not @latest, for two reasons. x/exp raises its own go directive
      # freely — the August 2026 snapshot needs Go 1.26 and this job runs
      # GOTOOLCHAIN=local on go.mod's toolchain (#109), so @latest failed on the
      # very commit that added this job. And a tool version that can change
      # under CI breaks builds for reasons unrelated to the change being
      # reviewed, which is the opposite of what this job is for.
      - name: Install apidiff
        run: go install golang.org/x/exp/cmd/apidiff@v0.0.0-20250718183923-645b1fa84792

      # The base is HEAD^1, not github.event.pull_request.base.sha. The checkout
      # is the pull request's merge ref, whose first parent is the base branch
      # as it is now; base.sha is the base branch as it was when the pull
      # request was opened. Once main moves they differ, and diffing the merge
      # ref against the older one blames the pull request for every break
      # merged in between — #392 was told to declare #383's renames (#394).
      - name: Compare the exported API against the base
        shell: bash
        run: bash ./.github/scripts/api-diff.sh "$(git rev-parse HEAD^1)" "${{ github.event.pull_request.number }}"

  # The race detector runs on two runners, and Race Detection, the check the
  # main branch requires, passes when both do (#888).
  #
  # Split because one runner was six and a half minutes of four CPUs shared
  # by everything: plan alone takes about as long as every other package
  # together, so it gets a runner to itself and the rest share the other.
  # Splitting runners is safe here for the same reason it is for the
  # benchmarks: each test still runs exactly as it did.
  #
  # internal/docsguard is left out of the race run. It checks files and runs
  # go build, has no shared state for the detector to find a race in, and
  # cost this job two minutes of CPU; the ordinary job runs it on every OS.
  race-shard:
    name: Race shard (${{ matrix.shard }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        shard: [plan, others]

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          # See the Setup Go step in the lint-and-test job for why this is a
          # minor-version spec rather than go-version-file: go.mod (#109).
          go-version: '1.27'
          cache: true

      # -json, so the next step can say where the time went (#888): a test that
      # grows under the race detector is otherwise invisible until it times
      # out, as plan did in #763. The log below is what go test would have
      # printed: every package's result line, every failing test's output in
      # full, and any build output.
      - name: Run tests with race detector
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -uo pipefail

          module=github.com/TuSKan/astrogo
          if [ "$SHARD" = plan ]; then
            packages=$module/plan
          else
            packages=$(go list ./... | grep -v -x -e "$module/plan" -e "$module/internal/docsguard")
          fi

          # shellcheck disable=SC2086 # one package path per word
          go test -race -short -count=1 -json $packages > race.json
          status=$?

          jq -rj --slurp '
            (map(select(.Action == "fail" and .Test != null) | {key: "\(.Package) \(.Test)", value: true})
              | from_entries) as $failed
            | .[]
            | select(.Action == "build-output"
                or (.Action == "output" and (.Test == null or $failed["\(.Package) \(.Test)"])))
            | .Output' race.json || status=1

          exit "$status"

      - name: Report the slowest tests
        if: always()
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail

          [ -s race.json ] || exit 0

          # Seconds, package, test: one row per line, slowest first. A
          # parallel test's time includes waiting for a slot, so read these
          # as where the time went rather than as each test's own cost.
          # Subtests are ranked with the rest: a parent whose subtests are
          # parallel returns before they run and reports almost nothing,
          # which is how fourteen seconds of kepler's oracle sweep went
          # unseen (#888).
          rows() {
            jq -r "$1"' | [.Elapsed, (.Package | sub("^github.com/TuSKan/astrogo/?"; "")), .Test // ""] | @tsv' race.json \
              | sort -t$'\t' -k1,1 -rn \
              | awk -F'\t' -v n="$2" 'NR <= n { printf "| %.1f | `%s` | %s |\n", $1, ($2 == "" ? "." : $2), $3 }'
          }

          # Into the job summary, and the log too, where gh run view can read it.
          {
            echo "## Race detector, $SHARD: where the time went"
            echo
            echo "| seconds | package | |"
            echo "|---:|---|---|"
            rows 'select((.Action == "pass" or .Action == "fail") and .Test == null and .Elapsed != null)' 10
            echo
            echo "| seconds | package | test or subtest |"
            echo "|---:|---|---|"
            rows 'select((.Action == "pass" or .Action == "fail") and .Test != null)' 25
          } | tee -a "$GITHUB_STEP_SUMMARY"

  race-detection:
    name: Race Detection
    runs-on: ubuntu-latest
    needs: race-shard
    if: always()

    steps:
      - name: Every shard passed
        env:
          RESULT: ${{ needs.race-shard.result }}
        run: |
          echo "race shards: $RESULT"
          [ "$RESULT" = success ]

  # These numbers are recorded and compared, but nothing here fails a build.
  #
  # ns/op on a shared runner is too noisy to gate on, and a noisy gate gets
  # muted — this repository already had one job failing every run for an
  # unrelated reason, which is how it went unread (#238). The hard guarantees
  # live in the allocation contracts (coord/allocs_test.go and its siblings):
  # deterministic, and in the ordinary test job where they block a merge.
  #
  # What this job owes its reader is a delta, on the run page. Before #248 it
  # uploaded an artifact nothing opened, so it faithfully recorded
  # "BenchmarkSwapOptimized_100 ... 149427883656 B/op" — 149 GB per operation —
  # on every merge for months while #246 was live, and reported nothing.
  #
  # The benchmarks run on four runners at once and are reported by one job.
  # .github/scripts/bench-shards.sh holds the shard table, why the split is safe
  # for the measurements (each benchmark still runs alone on its CPU) and how it
  # is balanced. bench-plan only reads that table, so the matrix cannot drift
  # from it.
  bench-plan:
    name: Benchmark shards
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'

    outputs:
      shards: ${{ steps.list.outputs.shards }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: List the shards
        id: list
        run: echo "shards=$(bash .github/scripts/bench-shards.sh json)" >> "$GITHUB_OUTPUT"

  bench-shard:
    name: Benchmarks (${{ matrix.shard }})
    needs: bench-plan
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'

    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.bench-plan.outputs.shards) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          # See the Setup Go step in the lint-and-test job for why this is a
          # minor-version spec rather than go-version-file: go.mod (#109).
          go-version: '1.27'
          cache: true

      - name: Run benchmarks
        # The shard's packages, which together with the other shards' are the
        # whole module: bench-shards.sh computes the last shard as everything
        # the others leave out. The whole module is the right scope:
        # remote/file's ReadAt strategy benchmark is one CLAUDE.md explicitly
        # says not to lose.
        #
        # The list is written to a file first, so a failure of the script
        # fails this step instead of leaving go test with no packages, which
        # would benchmark the current directory instead.
        #
        # -count=6 rather than 3, so benchstat has the samples to say anything
        # other than "~". Affordable now: fixing #246 took the worst plan
        # benchmark from ~68 s to ~1.5 s.
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          bash .github/scripts/bench-shards.sh packages "$SHARD" > packages.txt
          go test $(cat packages.txt) \
            -run=^$ \
            -bench=. \
            -benchmem \
            -count=6 \
            -timeout=30m \
            | tee "bench-$SHARD.txt"

      - name: Upload the shard's results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-${{ github.sha }}-${{ matrix.shard }}
          path: bench-${{ matrix.shard }}.txt
          if-no-files-found: error
          # Read only by the benchmarks job of this same run, which keeps the
          # combined results for 90 days.
          retention-days: 1

  # Runs only when every shard succeeded: a delta missing a shard would show
  # that shard's benchmarks as removed rather than as not run.
  benchmarks:
    name: Benchmarks
    needs: bench-shard
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'

    permissions:
      contents: read
      # Listing this workflow's earlier runs and downloading their artifacts,
      # which is what the comparison below is built on.
      actions: read

    env:
      # No checkout here, so gh is told the repository rather than reading it
      # from a git remote.
      GH_REPO: ${{ github.repository }}

    steps:
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27'
          # Nothing is built here but benchstat, and with no checkout there is
          # no go.sum to key a cache on.
          cache: false

      - name: Install benchstat
        # Pinned, like apidiff above: a comparison tool that moves under you
        # turns a real delta and a tooling change into the same diff.
        run: go install golang.org/x/perf/cmd/benchstat@v0.0.0-20260908200009-22c9c6c9d4da

      - name: Collect the shards
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bench-${{ github.sha }}-*
          merge-multiple: true
          path: shards

      - name: Combine the shards
        # One file, in the format the single-runner job wrote, so a delta can
        # be taken against a run from before the split as well as after it.
        run: cat shards/bench-*.txt > bench.txt

      - name: Compare against the previous run on this branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          summary() { cat >> "$GITHUB_STEP_SUMMARY"; }

          run=$(gh run list \
            --workflow ci.yml \
            --branch "$GITHUB_REF_NAME" \
            --status success \
            --limit 20 \
            --json databaseId,headSha \
            --jq "[.[] | select(.headSha != \"$GITHUB_SHA\")][0] // empty | \"\(.databaseId) \(.headSha)\"")

          if [ -z "$run" ]; then
            echo '_No earlier successful run on this branch to compare against._' | summary
            exit 0
          fi

          previous=${run% *}
          previous_sha=${run#* }

          # By name: that run also holds its shards' one-day artifacts, and
          # the combined results are the ones kept for 90 days. A missing
          # artifact is the ordinary case once retention lapses, so this
          # reports and moves on rather than failing the job.
          if ! gh run download "$previous" --name "benchmarks-$previous_sha" --dir previous 2>/dev/null; then
            echo "_Run $previous kept no downloadable benchmark artifact (90-day retention)._" | summary
            exit 0
          fi

          baseline=$(find previous -name bench.txt -print -quit)
          if [ -z "$baseline" ]; then
            echo "_Run $previous uploaded no bench.txt._" | summary
            exit 0
          fi

          {
            echo "## Benchmark delta"
            echo
            echo "Against run [$previous](https://github.com/$GITHUB_REPOSITORY/actions/runs/$previous)."
            echo
            echo '```'
            benchstat "$baseline" bench.txt || echo 'benchstat failed; the raw results are attached as an artifact.'
            echo '```'
          } | summary

      - name: Upload benchmark results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: benchmarks-${{ github.sha }}
          path: bench.txt
          retention-days: 90

  # Runs on push to main, not on a pull request: it is the *base* moving that
  # invalidates an already-green PR, and nothing re-runs those checks when it
  # does. See the script for the case that motivated it (#169 merged cleanly
  # and did not compile).
  open-prs-still-build:
    name: Open PRs still build against main
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Full history: the job merges other branches into this commit.
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          # See the Setup Go step in the lint-and-test job for why this is a
          # minor-version spec rather than go-version-file: go.mod (#109).
          go-version: '1.27'
          cache: true

      - name: Trial-merge every open PR and build it
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash ./.github/scripts/open-prs-still-build.sh

  integration:
    name: Integration Tests (External APIs)
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          # See the Setup Go step in the lint-and-test job for why this is a
          # minor-version spec rather than go-version-file: go.mod (#109).
          go-version: '1.27'
          cache: true

      - name: Run integration tests
        run: go test -tags=integration -v -count=1 -timeout=10m ./...