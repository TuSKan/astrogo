name: Validation

# Not on the PR path, by design. These jobs query JPL Horizons, USNO, NASA,
# ESO, CDS and CelesTrak; someone else's downtime must never block a merge.
#
# Two cadences, because the two tiers answer different questions and go stale
# at different rates.
#
# The network tier runs nightly. It is the only thing that notices a SIMBAD
# schema change, a Horizons response-format change or a VizieR column rename —
# failures that arrive without warning, and that `go vet -tags` cannot see
# because the code still compiles. A week is a long time to be wrong about
# whether the catalog layer works, and #102 is why: a schema change surfaces
# as "target not found" rather than as an error.
#
# The validation and integration tiers stay weekly. JPL and USNO are stable,
# the runs are heavier, and nothing they measure changes daily.
#
# Nightly against CDS is acceptable; hourly would not be. One run a day is the
# cadence, and the per-run burst is the thing to watch instead — CelesTrak
# answers a burst with a 403 (#206).
on:
  workflow_dispatch:
  schedule:
    # Nightly: the network tier.
    - cron: '17 4 * * *'
    # Mondays: the validation and integration tiers.
    - cron: '43 4 * * 1'

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Suites that have been retrofitted onto internal/metrology write their
  # machine-readable results here. Suites that have not are unaffected.
  ASTROGO_METROLOGY_OUT: ${{ github.workspace }}/validation-out

jobs:
  network:
    name: Network Tests (live catalog services)
    # Every night, and on demand. The condition names the nightly cron rather
    # than excluding the weekly one, so adding a third schedule cannot silently
    # enrol this job in it.
    if: github.event_name != 'schedule' || github.event.schedule == '17 4 * * *'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          # Track go.mod rather than a hardcoded version, so this workflow
          # cannot drift onto a different toolchain from ci.yml.
          # See the Setup Go step in the lint-and-test job for why this is a
          # minor-version spec rather than go-version-file: go.mod (#109).
          go-version: '1.27'
          cache: true

      - name: Prepare output directory
        run: mkdir -p "$ASTROGO_METROLOGY_OUT"

      - name: Run network-dependent tests
        if: always()
        shell: bash
        run: go test -tags=network -v -count=1 -timeout=15m ./... 2>&1 | tee "$ASTROGO_METROLOGY_OUT/network.log"

      # The README's network examples (#1188). The offline ones run on every
      # commit (ci.yml); these reach SIMBAD, MAST, CelesTrak, SBDB and the
      # kernel and dataset hosts, and were found broken at the release commit
      # only by running them by hand. TestNetworkExamplesRun skips an example
      # whose hosts cannot be reached, as the network tests do, and fails one
      # that reaches them and still exits non-zero.
      #
      # They download about half a gigabyte, two JPL kernels and two sky
      # datasets, all immutable. The cache keeps them between nights, so JPL
      # and the dataset hosts are asked once rather than nightly; the key is
      # fixed because nothing in it goes stale, and the IERS bulletin, which
      # does, is checked against its source on every run anyway.
      - name: Restore the examples' downloads
        if: always()
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/astrogo-examples-cache
          key: astrogo-examples-downloads-v1

      - name: Run the network examples
        if: always()
        shell: bash
        working-directory: examples
        env:
          ASTROGO_CACHE_DIR: file://${{ runner.temp }}/astrogo-examples-cache
        run: go test -tags=network -v -count=1 -timeout=90m -run '^TestNetworkExamplesRun$' . 2>&1 | tee "$ASTROGO_METROLOGY_OUT/network-examples.log"

      # Every result against the accuracy its suite reached at the last
      # accepted run, docs/validation-baseline.json: a percentile that more
      # than doubles fails here even inside its contract (#1109). It runs
      # after a failed suite too, since one suite's regression is news
      # whatever another did.
      - name: Compare with the accuracy baseline
        if: always()
        shell: bash
        run: go test -tags=validation -count=1 -v -run '^TestResultsHoldTheBaseline$' ./internal/metrology/ -args -check-baseline

      - name: Upload network results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: network-${{ github.sha }}
          path: ${{ env.ASTROGO_METROLOGY_OUT }}
          retention-days: 90

  validation:
    name: Validation Tests (JPL Horizons + SOFA)
    # Mondays, and on demand.
    if: github.event_name != 'schedule' || github.event.schedule == '43 4 * * 1'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27'
          cache: true

      - name: Prepare output directory
        run: mkdir -p "$ASTROGO_METROLOGY_OUT"

      # TestSFDMatchesIRSA holds the local SFD dust map to IRSA's own answers,
      # and compares only the answers the dust package's cache holds. A runner
      # starts with an empty cache, so until #662 it skipped here on every run.
      #
      # This seeds the cache with IRSA's answers, kept in the repository, which
      # is the pre-seeding the README describes for EOP data. The live service
      # is exercised nightly by the dust package's network test.
      #
      # The GAMBONS comparisons used to ask IRSA for their few hundred
      # sightlines one query at a time, two seconds apart: 22.5 minutes, against
      # a 15-minute timeout that failed every run from 31 August to 5 October
      # (#660). They read the SFD map directly since #663, the same map
      # TestSFDMatchesIRSA downloads, and do not consult this cache.
      - name: Seed the IRSA dust cache
        shell: bash
        run: |
          dir="$HOME/.cache/astrogo/skybrightness/dataset/dust"
          mkdir -p "$dir"
          cp .github/validation-cache/irsa-dust-i100.txt "$dir/i100.txt"

      # Both steps run even when the first fails: a failing integration suite
      # must not hide the validation numbers, and a suite that did not run at
      # all has to be visible as "not verified" rather than merely absent from
      # the report.
      - name: Run integration tests
        id: integration
        if: always()
        shell: bash
        run: go test -tags=integration -v -count=1 -timeout=15m ./... 2>&1 | tee "$ASTROGO_METROLOGY_OUT/integration.log"

      - name: Run validation tests
        id: validation
        if: always()
        shell: bash
        run: go test -tags=validation -v -count=1 -timeout=15m ./... 2>&1 | tee "$ASTROGO_METROLOGY_OUT/validation.log"

      # As in the network job: the results of both runs above against
      # docs/validation-baseline.json (#1109).
      - name: Compare with the accuracy baseline
        if: always()
        shell: bash
        run: go test -tags=validation -count=1 -v -run '^TestResultsHoldTheBaseline$' ./internal/metrology/ -args -check-baseline

      # The cache as this run left it, seed and anything newly fetched, so a
      # refreshed seed is one artifact download rather than a hand-run fetch.
      - name: Keep the IRSA dust cache
        if: always()
        shell: bash
        run: |
          f="$HOME/.cache/astrogo/skybrightness/dataset/dust/i100.txt"
          if [ -f "$f" ]; then cp "$f" "$ASTROGO_METROLOGY_OUT/irsa-dust-i100.txt"; wc -l "$f"; fi

      - name: Upload validation results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: validation-${{ github.sha }}
          path: ${{ env.ASTROGO_METROLOGY_OUT }}
          retention-days: 90

  # The generated accuracy table in docs/VALIDATION.md, rendered from the
  # newest results of every tier (#1199). Nothing ran the renderer before, so
  # every row read 2026-10-06 for six weeks while the prose beside the table
  # quoted later runs.
  #
  # It renders and does not commit. A pull request opened with this workflow's
  # token starts no workflow runs, and main's required checks run only on
  # pull_request events, so such a pull request could never merge. The weekly
  # release pull request carries the table instead: it renders these results
  # into main as it stands (docs/RELEASING.md), and the Changelog Fragment check
  # accepts a change there confined to the generated region.
  report:
    name: Accuracy Report
    needs: [network, validation]
    # Wherever the validation tier ran to its end: Mondays, and on demand. A
    # failed suite still belongs in the table, as outside its contract or not
    # verified, so a failed tier is rendered too.
    if: always() && (needs.validation.result == 'success' || needs.validation.result == 'failure')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # This run's artifacts, and on a Monday the newest nightly run's.
      actions: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27'
          cache: true

      - name: Collect this run's validation tier
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: validation-${{ github.sha }}
          path: ${{ runner.temp }}/results/validation

      - name: Collect this run's network tier
        if: needs.network.result != 'skipped'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: network-${{ github.sha }}
          path: ${{ runner.temp }}/results/network

      # On a Monday the network tier ran in that night's run of this workflow,
      # not in this one. Its newest results are taken, from a run that may
      # still be going or one from an earlier night; every row of the table
      # names the date and commit its suite ran at, so which is visible.
      - name: Collect the network tier from the newest nightly run
        if: needs.network.result == 'skipped'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          runs=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow pre-release.yml --limit 30 \
            --json databaseId --jq ".[] | select(.databaseId != $GITHUB_RUN_ID) | .databaseId")

          for run in $runs; do
            if gh run download "$run" --repo "$GITHUB_REPOSITORY" --pattern 'network-*' \
              --dir "$RUNNER_TEMP/results/network" 2>/dev/null; then
              echo "The network tier's results are run $run's."
              exit 0
            fi
          done

          echo "::error::None of the last 30 runs kept network results to render."
          exit 1

      # A suite both tiers ran, as every untagged one is, keeps the newer of
      # its two results. A tier with no results fails the job rather than
      # rendering a table without its rows.
      - name: Gather the results
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$ASTROGO_METROLOGY_OUT"

          for tier in validation network; do
            found=$(find "$RUNNER_TEMP/results/$tier" -name '*.json' -type f 2>/dev/null || true)
            if [ -z "$found" ]; then
              echo "::error::No $tier results to render."
              exit 1
            fi

            while read -r f; do
              dest="$ASTROGO_METROLOGY_OUT/$(basename "$f")"
              if [ -f "$dest" ]; then
                this=$(jq -er .generated "$f")
                kept=$(jq -er .generated "$dest")
                if [[ "$this" < "$kept" ]]; then
                  continue
                fi
              fi

              cp "$f" "$dest"
            done <<<"$found"

            echo "$tier: $(echo "$found" | wc -l) result(s)"
          done

      - name: Render the accuracy table
        shell: bash
        run: go test -tags=validation -count=1 -v -run '^TestRenderAccuracyReport$' ./internal/metrology/ -args -update-accuracy

      - name: Summarize the change
        shell: bash
        run: |
          {
            echo "## Accuracy report"
            echo
            if git diff --quiet docs/VALIDATION.md; then
              echo "docs/VALIDATION.md's generated table is current for these results."
            else
              echo "The release pull request renders these results into docs/VALIDATION.md (docs/RELEASING.md)."
              echo
              echo '```diff'
              git diff docs/VALIDATION.md
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the results the table was rendered from
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: accuracy-results-${{ github.sha }}
          path: ${{ env.ASTROGO_METROLOGY_OUT }}/*.json
          retention-days: 90
